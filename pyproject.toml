[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polelo"
version = "0.1.0"
description = "STEM Sepedi Translation Layer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "motor>=3.7.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.1.0",
    "aiohttp>=3.11.0",
    "paho-mqtt>=2.1.0",
    "playwright>=1.49.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
