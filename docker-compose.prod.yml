# ============================================================
# Polelo — Production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    environment:
      LOG_LEVEL: WARNING
      LOG_FORMAT: json

  postgres:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  minio:
    restart: always

  mqtt:
    restart: always

